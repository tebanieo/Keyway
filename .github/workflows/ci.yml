name: CI

# The same gate the Lefthook pre-commit hook runs (format, lint, typecheck,
# tests), but in CI so it can't be skipped with --no-verify or a missing hook
# install, and so pull requests (including from forks) are checked before merge.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The committed wasm/pkg must be exactly what wasm/ builds to, so the shipped
  # binary is provably the open-source extenddb-core and nothing else.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (wasm/rust-toolchain.toml)
        working-directory: wasm
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            wasm/target
          key: wasm-${{ hashFiles('wasm/Cargo.lock', 'wasm/rust-toolchain.toml') }}
      - name: Install wasm-bindgen-cli
        run: |
          want=$(sed -n 's/^wasm-bindgen = "=\(.*\)"/\1/p' wasm/Cargo.toml)
          wasm-bindgen --version | grep -q " $want$" ||
            cargo install wasm-bindgen-cli --version "$want" --locked --force
      - name: Format and lint (rustfmt, clippy)
        working-directory: wasm
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests (native)
        working-directory: wasm
        run: cargo test --locked
      - name: Rebuild wasm/pkg
        run: npm run wasm:build
      - name: Committed wasm/pkg matches its source
        run: git diff --exit-code -- wasm/pkg

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, matching the npm that generated package-lock.json
          # (npm 10 resolves peer deps differently and rejects `npm ci`).
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npx tsc -b
      - name: Tests (Vitest) with coverage
        run: npm run coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tebanieo/Keyway
          files: ./coverage/lcov.info
          # Coverage reporting is informational; a Codecov hiccup (e.g. rate
          # limit) shouldn't fail the gate that guards merges.
          fail_ci_if_error: false
