name: Deploy to GitHub Pages

# Builds the static app and publishes it to GitHub Pages on every push to main.
# Enable it once: repo Settings → Pages → Build and deployment → Source =
# "GitHub Actions". No secrets, no server. It just uploads the built `dist/`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, matching the npm that generated package-lock.json.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Reference manual (VitePress) → served at <site>/docs alongside the app.
      - run: npm run docs:build
      - run: cp -r docs/.vitepress/dist dist/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
