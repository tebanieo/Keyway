name: CI

# The same gate the Lefthook pre-commit hook runs (format, lint, typecheck,
# tests), but in CI so it can't be skipped with --no-verify or a missing hook
# install, and so pull requests (including from forks) are checked before merge.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, matching the npm that generated package-lock.json
          # (npm 10 resolves peer deps differently and rejects `npm ci`).
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npx tsc -b
      - name: Tests (Vitest) with coverage
        run: npm run coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tebanieo/Keyway
          files: ./coverage/lcov.info
          # Coverage reporting is informational; a Codecov hiccup (e.g. rate
          # limit) shouldn't fail the gate that guards merges.
          fail_ci_if_error: false
